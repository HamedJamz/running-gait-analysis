[project]
name = "rungait"
version = "0.1.0"
description = "Running gait analysis from 3D motion capture (C3D) and instrumented treadmill data"
authors = [{ name = "Hamed Jamalzehi" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["ezc3d>=1.5", "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.8", "pillow>=10.0"]

[tool.setuptools]
packages = ["rungait"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
